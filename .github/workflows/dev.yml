name: Desenvolvimento

on:
  pull_request:
    branches: [desenvolvimento]
  push:
    branches: [desenvolvimento]

jobs:
  teste-e-lint:
    name: teste e lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Testa o monolito
        working-directory: api/eleicoes-app
        run: mvn -B -ntp test

      - name: Testa a urna
        working-directory: api/votacao
        run: mvn -B -ntp test

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Lint e testes do mobile
        working-directory: mobile
        run: |
          npm ci
          npm run lint
          npm run test:unit

  pre-release:
    name: pre-release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: desenvolvimento
    permissions:
      contents: read
      pull-requests: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: versao
        name: Calcula a pre-release
        run: |
          version="$(bash .github/scripts/dev-version.sh)"
          short="$(git rev-parse --short=12 HEAD)"
          echo "value=${version}" >> "$GITHUB_OUTPUT"
          echo "nome=${version}+${short}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - id: revisao
        name: Exige review aprovado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/approved-reviewers.sh "${{ steps.versao.outputs.sha }}" > reviewers.txt
          jq -Rn '{reviewers: [inputs]}' < reviewers.txt > review.json
          jq --arg repo "${{ github.repository }}" \
            --arg sha "${{ steps.versao.outputs.sha }}" \
            '. + {repository: $repo, ref: "refs/heads/desenvolvimento", sha: $sha}' \
            review.json > predicate.json
          printf '%s\n' "${{ steps.versao.outputs.sha }}" > dev-sha.txt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Builda a pre-release
        run: bash .github/scripts/build.sh "${{ steps.versao.outputs.value }}" dist dev

      - name: Registra a revisao
        uses: actions/attest@v2
        with:
          subject-path: dev-sha.txt
          predicate-type: https://github.com/${{ github.repository }}/attestations/code-review/v1
          predicate-path: predicate.json

      - name: Assume o papel da conta
        if: vars.AWS_ROLE != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Publica na conta do ambiente
        if: vars.AWS_ROLE != ''
        env:
          BUCKET: ${{ vars.AWS_ARTIFACT_BUCKET }}
          AMBIENTE: desenvolvimento
          VERSAO: ${{ steps.versao.outputs.nome }}
        run: |
          if [[ -z "$BUCKET" ]]; then
            echo "Papel da conta ${AMBIENTE} assumido. Defina a variavel AWS_ARTIFACT_BUCKET para enviar os arquivos."
            aws sts get-caller-identity
            exit 0
          fi
          aws s3 sync dist "s3://${BUCKET}/${VERSAO}/" --only-show-errors
