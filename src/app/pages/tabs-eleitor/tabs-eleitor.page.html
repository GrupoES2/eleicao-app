<ion-header>
  <ion-toolbar color="dark">
    <ion-title>Área do Eleitor</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="sair()">
        <ion-icon name="log-out-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-tabs>
  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="votar" routerLink="/tabs-eleitor/votar">
      <ion-icon name="checkbox-outline"></ion-icon>
      <ion-label>Votar</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="resultados" routerLink="/tabs-eleitor/resultados">
      <ion-icon name="bar-chart-outline"></ion-icon>
      <ion-label>Resultados</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
