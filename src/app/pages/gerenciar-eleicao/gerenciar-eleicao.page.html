<ion-header>
  <ion-toolbar color="White">
    <ion-title>Gerenciar Eleição</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content class="ion-padding">

  <!-- Botão de Criar Eleição (FAB) - Fica flutuando no canto inferior direito -->
  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button (click)="criarEleicao()">
      <ion-icon name="add-outline"></ion-icon>
    </ion-fab-button>
  </ion-fab>

  <div *ngIf="carregando" style="text-align: center; margin-top: 50px;">
    <ion-spinner></ion-spinner>
  </div>

  <div *ngIf="!carregando && eleicoes.length === 0">
    <p style="text-align: center;">Nenhuma eleição cadastrada. Clique no + para criar.</p>
  </div>

  <ion-card *ngFor="let eleicao of eleicoes">
    <ion-card-header>
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <ion-card-title>{{ eleicao.cargo }}</ion-card-title>
        <ion-button fill="clear" style="color: white;" (click)="excluirEleicao(eleicao)">
          <ion-icon name="trash-bin-outline"></ion-icon>
        </ion-button>
      </div>
    </ion-card-header>
    
    
    <ion-card-content>
      <p><strong>Data:</strong> {{ eleicao.data }} | <strong>Turno:</strong> {{ eleicao.turno }}</p>
      <p><strong>Horário:</strong> {{ eleicao.horarioAbertura }} às {{ eleicao.horarioEncerramento }}</p>
      
      <h2 style="text-align: center; margin-top: 10px;">
        <ion-badge [color]="eleicao.status === 'AGENDADA' ? 'warning' : (eleicao.status === 'ABERTA' ? 'success' : 'medium')">
          {{ eleicao.status }}
        </ion-badge>
      </h2>
      
      <ion-button *ngIf="eleicao.status === 'AGENDADA'" expand="block" style="background-color: #355C7D; border-color: #355C7D;" (click)="mudarStatus(eleicao, 'ABERTA')">
        Abrir Votação
      </ion-button>

      <ion-button *ngIf="eleicao.status === 'ABERTA'" expand="block" color="danger" (click)="mudarStatus(eleicao, 'ENCERRADA')">
        Encerrar Votação
      </ion-button>

      <ion-button *ngIf="eleicao.status === 'ENCERRADA'" expand="block" color="medium" disabled>
        Votação Encerrada
      </ion-button>
    </ion-card-content>
  </ion-card>
</ion-content>
