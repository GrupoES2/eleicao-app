name: Release

on:
  workflow_dispatch:
    inputs:
      versao:
        description: Numero da release, sem o v. Exemplo 0.1.0
        required: true
        type: string
      sha:
        description: SHA em desenvolvimento. Vazio usa o commit selecionado ao disparar.
        required: false
        type: string

jobs:
  preparar:
    name: preparar
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
      versao: ${{ steps.pin.outputs.versao }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: pin
        name: Confere versao, SHA e review
        env:
          GH_TOKEN: ${{ github.token }}
          INFORMADA: ${{ inputs.versao }}
          SHA_INFORMADO: ${{ inputs.sha }}
        run: |
          if [[ ! "$INFORMADA" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "A versao precisa ser X.Y.Z, sem o v."
            exit 1
          fi
          sha="${SHA_INFORMADO:-${{ github.sha }}}"
          sha="$(git rev-parse "$sha^{commit}")"
          git merge-base --is-ancestor "$sha" origin/desenvolvimento
          bash .github/scripts/approved-reviewers.sh "$sha" >/dev/null
          last=""
          while IFS= read -r tag; do
            last="$tag"
            break
          done < <(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname)
          if [[ -n "$last" ]]; then
            maior="$(printf '%s\n%s\n' "${last#v}" "$INFORMADA" | sort -V | tail -n 1)"
            if [[ "$maior" != "$INFORMADA" || "$INFORMADA" == "${last#v}" ]]; then
              echo "A versao ${INFORMADA} nao e maior que ${last}."
              exit 1
            fi
          fi
          if git rev-parse -q --verify "refs/tags/v${INFORMADA}" >/dev/null; then
            echo "A tag v${INFORMADA} ja existe."
            exit 1
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "versao=${INFORMADA}" >> "$GITHUB_OUTPUT"

  build-um:
    name: primeiro build
    needs: preparar
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preparar.outputs.sha }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Builda sem cache de dependencias
        run: bash .github/scripts/build.sh "${{ needs.preparar.outputs.versao }}" dist release

      - uses: actions/upload-artifact@v4
        with:
          name: build-um
          path: dist

  build-dois:
    name: segundo build
    needs: [preparar, build-um]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preparar.outputs.sha }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Builda de novo, em outro runner e sem cache
        run: bash .github/scripts/build.sh "${{ needs.preparar.outputs.versao }}" dist release

      - uses: actions/upload-artifact@v4
        with:
          name: build-dois
          path: dist

  publica:
    name: publica
    needs: [preparar, build-um, build-dois]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-um
          path: um

      - uses: actions/download-artifact@v4
        with:
          name: build-dois
          path: dois

      - name: Barra a versao se os digests divergirem
        run: |
          if ! diff -u um/SHA256SUMS dois/SHA256SUMS; then
            echo "Os dois builds da versao ${{ needs.preparar.outputs.versao }} divergiram. Publicacao barrada."
            exit 1
          fi
          mkdir -p dist
          cp um/eleicoes-app-${{ needs.preparar.outputs.versao }}.jar dist/
          cp um/votacao-${{ needs.preparar.outputs.versao }}.jar dist/
          cp um/mobile-${{ needs.preparar.outputs.versao }}.zip dist/
          cp um/SHA256SUMS dist/

      - name: Provenance dos artefatos
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/eleicoes-app-${{ needs.preparar.outputs.versao }}.jar
            dist/votacao-${{ needs.preparar.outputs.versao }}.jar
            dist/mobile-${{ needs.preparar.outputs.versao }}.zip

      - name: Grava o predicado da release
        env:
          VERSAO: ${{ needs.preparar.outputs.versao }}
          SHA: ${{ needs.preparar.outputs.sha }}
        run: |
          jq -Rn --arg version "$VERSAO" --arg sha "$SHA" --arg repo "${{ github.repository }}" \
            'reduce inputs as $line ({version: $version, sha: $sha, repository: $repo, digests: {}};
              ($line | capture("(?<digest>[0-9a-f]+)  (?<nome>.+)")) as $p
              | .digests[$p.nome] = ("sha256:" + $p.digest))' \
            < dist/SHA256SUMS > release-predicate.json

      - uses: actions/attest@v2
        with:
          subject-path: |
            dist/eleicoes-app-${{ needs.preparar.outputs.versao }}.jar
            dist/votacao-${{ needs.preparar.outputs.versao }}.jar
            dist/mobile-${{ needs.preparar.outputs.versao }}.zip
          predicate-type: https://github.com/${{ github.repository }}/attestations/release/v1
          predicate-path: release-predicate.json

      - name: Publica a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSAO: ${{ needs.preparar.outputs.versao }}
          SHA: ${{ needs.preparar.outputs.sha }}
        run: |
          gh release create "v${VERSAO}" dist/* \
            --target "$SHA" \
            --title "v${VERSAO}" \
            --notes "Release v${VERSAO} do SHA ${SHA}. Os dois builds produziram o mesmo digest."
